plugins {
    id 'com.android.application'
}

def sdlVersion = "3.2.4"
def sdlAarName = "SDL3-${sdlVersion}.aar"
def libsDir = file("libs")
def sdlAarFile = file("libs/${sdlAarName}")

// Auto-download SDL3 AAR fallback if not present in libs/
if (!sdlAarFile.exists()) {
    libsDir.mkdirs()
    def zipUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip"
    def tempZip = file("${layout.buildDirectory.get().asFile}/SDL3-android.zip")
    tempZip.parentFile.mkdirs()
    println "[ReContra] Downloading SDL3 Android development package from ${zipUrl}..."
    try {
        def conn = new URL(zipUrl).openConnection()
        conn.setRequestProperty("User-Agent", "curl/7.88.1")
        conn.inputStream.withStream { i -> tempZip.withOutputStream { it << i } }
        println "[ReContra] Extracting ${sdlAarName} to libs/..."
        copy {
            from zipTree(tempZip).matching { include "${sdlAarName}" }
            into libsDir
            includeEmptyDirs = false
        }
        tempZip.delete()
        println "[ReContra] SDL3 Android package ready."
    } catch (Exception e) {
        println "[ReContra] Notice: SDL3 AAR can be placed directly at android/app/libs/${sdlAarName}: " + e.getMessage()
    }
}

android {
    namespace 'com.recontra.game'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId "com.recontra.game"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/${sdlAarName}")
}
