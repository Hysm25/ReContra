name: Android CI Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup SDL3 Android AAR
        run: |
          mkdir -p android/app/libs
          curl -sSL "https://github.com/libsdl-org/SDL/releases/download/release-3.2.4/SDL3-devel-3.2.4-android.zip" -o /tmp/sdl3.zip
          unzip -q -o /tmp/sdl3.zip "SDL3-3.2.4.aar" -d android/app/libs/
          rm -f /tmp/sdl3.zip
          ls -la android/app/libs/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReContra-debug-arm64-v8a
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
